<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | TalNXT Technologies</title>
<meta name="description" content="The page you were looking for could not be found. You will be taken back to the TalNXT homepage." />
<meta name="robots" content="noindex, follow" />
<base href="/" />
<meta http-equiv="refresh" content="10;url=/index.html" />
<link rel="icon" href="/logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="/css/site.css" rel="stylesheet" />
<script src="/js/consent.js"></script>
<style>
  .nf-wrap{min-height:100vh;display:flex;flex-direction:column}
  .nf-main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
  .nf-card{max-width:640px;text-align:center}
  .nf-code{font-family:'Newsreader',Georgia,serif;font-size:96px;line-height:1;font-weight:600;color:var(--accent,#1b5fc4);margin:0 0 8px}
  .nf-card h1{font-size:28px;margin:0 0 10px}
  .nf-card p{color:var(--muted,#58657a);margin:0 0 18px;line-height:1.6}
  .nf-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0 28px}
  .nf-links{display:flex;gap:8px 18px;justify-content:center;flex-wrap:wrap;font-size:14px;font-weight:600}
  .nf-links a{color:var(--accent,#1b5fc4)}
  .nf-head{padding:18px 24px;border-bottom:1px solid var(--line,#dbe1ea);background:#fff}
  .nf-head img{height:38px;width:auto;display:block}
</style>
</head>
<body>
<div class="nf-wrap">
  <header class="nf-head"><a href="/index.html" aria-label="TalNXT Technologies home"><img src="/logo.png" alt="TalNXT Technologies"></a></header>
  <main class="nf-main">
    <div class="nf-card">
      <div class="nf-code" aria-hidden="true">404</div>
      <h1>We couldn&rsquo;t find that page</h1>
      <p>The address may be mistyped, or the page may have moved. We&rsquo;ll take you back to the homepage in <strong id="nf-count">10</strong> seconds.</p>
      <div class="nf-actions">
        <a class="btn accent" href="/index.html">Go to homepage now &rarr;</a>
        <a class="btn" href="/index.html#contact">Contact us</a>
      </div>
      <nav class="nf-links" aria-label="Popular pages">
        <a href="/about.html">About</a>
        <a href="/how-we-help-businesses.html">How We Help Businesses</a>
        <a href="/industries.html">Industries</a>
        <a href="/candidates.html">For Candidates</a>
        <a href="/careers.html">Careers</a>
      </nav>
    </div>
  </main>
</div>
<script>
  (function () {
    var left = 10, el = document.getElementById('nf-count');
    var t = setInterval(function () {
      left--;
      if (el) el.textContent = left;
      if (left <= 0) { clearInterval(t); window.location.replace('/index.html'); }
    }, 1000);
  })();
</script>
</body>
</html>
